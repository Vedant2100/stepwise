name: Mobile apps

# Builds the Android APK and the iOS simulator app with Capacitor. The apps load the deployed site,
# so they always match the web version. Download them from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'ios/**', 'capacitor.config.json', 'assets/**', 'package.json', '.github/workflows/mobile.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v5
        with:
          name: stepwise-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/stepwise-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v5
        with:
          name: stepwise-ios-simulator
          path: stepwise-ios-simulator.zip
